name: Barnacle CI

on:
  # Verify every human push/PR. Pushes made with the repository GITHUB_TOKEN
  # do not recursively trigger workflows, so generated bot commits stay quiet
  # while direct data/model/docs changes can no longer bypass the gate.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barnacle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install checksum-pinned workflow and shell linters
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/barnacle-static-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error \
            --output "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tools/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          curl --fail --location --silent --show-error \
            --output "$tools/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $tools/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools"
          install -m 0755 \
            "$tools/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "$tools/shellcheck"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Lint workflows and shell entry points
        run: |
          actionlint -shellcheck=shellcheck
          shellcheck \
            bin/install_local_scheduler.sh \
            bin/local_nowcast_tick.sh \
            bin/watchdog_tick.sh \
            forecast/smoke_test.sh

      - name: Compile forecast code
        run: python -m compileall -q forecast tests

      - name: Type-check extracted pure seams
        run: |
          python -m pip install --disable-pip-version-check \
            -r forecast/typecheck-requirements.txt
          python -m mypy --strict \
            forecast/station_time.py \
            forecast/html_contract.py

      - name: Install production dependencies (GRIB decoder)
        run: python -m pip install --disable-pip-version-check -r forecast/requirements.txt

      - name: Run offline regression tests (decoder tests must run, not skip)
        env:
          BARNACLE_REQUIRE_GRIB: "1"
        run: python -m unittest discover -s tests -q

      - name: Validate committed artifacts and ledgers
        run: python forecast/check_artifacts.py
