name: Barnacle CI

on:
  # Verify every human push/PR. Pushes made with the repository GITHUB_TOKEN
  # do not recursively trigger workflows, so generated bot commits stay quiet
  # while direct data/model/docs changes can no longer bypass the gate.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barnacle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Compile forecast code
        run: python -m compileall -q forecast tests

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -q

      - name: Validate committed artifacts and ledgers
        run: python forecast/check_artifacts.py
