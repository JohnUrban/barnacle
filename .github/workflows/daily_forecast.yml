name: Bay Ave Barnacle Forecast

# Runs hourly (HANDOFF 9b.1 — sub-daily dynamic updates). Every run writes
# HTML + JSON and appends to data/predictions_log.csv. Alert delivery is
# event-driven on every run; 09:00 UTC adds the daily archive snapshot but
# does not imply a routine email. GitHub Actions cron does not adjust for DST.
#
# Also runnable manually from the Actions tab via workflow_dispatch —
# manual runs are treated as full-daily runs so testing exercises the
# email path.
on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour, UTC
  workflow_dispatch:
    inputs:
      force_email:
        description: "force the alert email regardless of evaluation
          ('false' for automated alert-ingest dispatches)"
        required: false
        default: 'true'

# One run at a time (2026-07-20): the 02:00 UTC slot double-fired,
# the two runs rebased into each other inside the commit step, and
# conflict markers shipped to the live site. Queued, never parallel.
concurrency:
  group: barnacle-forecast
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit docs/ + data/ updates

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/New_York

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install chart dependency
        run: pip install --quiet -r forecast/requirements.txt

      - name: Self-heal inherited corruption (markers in data/docs)
        run: python forecast/heal_tree.py

      - name: Determine run type (daily vs hourly)
        id: when
        run: |
          local_date=$(date +%Y-%m-%d)
          utc_date=$(date -u +%Y-%m-%d)
          hour=$(date -u +%H)
          manual="${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force_email || 'true') != 'false' }}"
          if [ "$manual" = "true" ] || [ "$hour" = "09" ]; then
            is_daily="true"
          else
            is_daily="false"
          fi
          {
            echo "local_date=$local_date"
            echo "utc_date=$utc_date"
            echo "hour=$hour"
            echo "is_daily=$is_daily"
          } >> "$GITHUB_OUTPUT"
          echo "Run type: is_daily=$is_daily (hour=$hour UTC, event=${{ github.event_name }})"

      # EVENT-DRIVEN ALERTING (2026-07-17; transactional 2026-07-21):
      # ntfy/email/SMS attempt independently when risk appears, escalates,
      # or a new same-rank event begins. Manual dispatch forces a send.
      - name: Run forecast (event-driven alert delivery)
        id: forecast
        env:
          # wind-shadow trial (SHADOW ONLY; audit 2026-09-24-a3 R8): the ONLY
          # place official trial records are written. Displays/alerts unaffected.
          BARNACLE_WIND_SHADOW_TRIAL: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        working-directory: forecast
        run: |
          extra=""
          if [ "${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force_email || 'true') != 'false' }}" = "true" ]; then
            extra="--force-email"
          fi
          # Audit 2026-09-27-a1 R7: exit 2 means every requested alert
          # channel failed AFTER the forecast artifacts were generated and
          # validated. Publish them anyway (gate + commit below), record the
          # outcome (data/alert_delivery_health.json), and fail the job only
          # after the push so the outage stays visible while the alert stays
          # eligible for retry. Any other non-zero exit is a generation
          # failure and stops the run before publication as before.
          set +e
          python3 flood_forecast_daily.py \
            --write-html ../docs/index.html \
            --write-json ../docs/forecast.json $extra
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "delivery_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::alert delivery failed on every requested channel; publishing the validated forecast, failing the job after push"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          else
            echo "delivery_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive today's forecast snapshot (daily only)
        if: steps.when.outputs.is_daily == 'true'
        run: |
          mkdir -p docs/archive
          cp docs/index.html  "docs/archive/${{ steps.when.outputs.local_date }}.html"
          cp docs/forecast.json "docs/archive/${{ steps.when.outputs.local_date }}.json"
          # No heat-map PNG to archive — map renders client-side (9b.10).

      - name: Regenerate archive index (daily only)
        if: steps.when.outputs.is_daily == 'true'
        run: |
          cd docs/archive
          {
            cat <<'HEAD'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Bay Ave Barnacle — Forecast Archive</title>
          <link rel="stylesheet" href="../style.css">
          </head>
          <body>
          <main>
            <header>
              <h1>Bay Ave Barnacle — Forecast Archive</h1>
              <p class="subtitle"><a href="../">&larr; Back to today's forecast</a></p>
            </header>
            <section>
              <h2>Past forecasts</h2>
              <ul class="archive-list">
          HEAD
            shopt -s nullglob
            files=(20*.html)
            for ((i=${#files[@]} - 1; i >= 0; i--)); do
              f=${files[i]}
              date_str="${f%.html}"
              echo "      <li><a href=\"$f\">$date_str</a></li>"
            done
            cat <<'TAIL'
              </ul>
            </section>
            <footer>
              <p><a href="https://github.com/JohnUrban/barnacle">Source code &amp; model</a></p>
            </footer>
          </main>
          </body>
          </html>
          TAIL
          } > index.html

      - name: Publish gate (no markers, strict JSON)
        run: python forecast/check_artifacts.py

      - name: Commit and push docs/ + data/ updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit FIRST (clean generated state), then rebase our commit
          # onto whatever landed meanwhile, re-run the publish gate, and
          # only then push. A failed rebase ABORTS the publish (next run
          # regenerates everything) instead of shipping merge artifacts
          # — the 02:00 twin-run race put conflict markers on the live
          # site through the old swallow-errors pull.
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "No updates to commit"
            exit 0
          fi
          if [ "${{ steps.when.outputs.is_daily }}" = "true" ]; then
            msg="daily forecast ${{ steps.when.outputs.local_date }}"
          else
            msg="hourly update ${{ steps.when.outputs.utc_date }} ${{ steps.when.outputs.hour }}:00 UTC"
          fi
          git commit -m "$msg"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              echo "REBASE CONFLICT — aborting publish (no corruption shipped)"
              git rebase --abort
              exit 1
            fi
            if ! python forecast/check_artifacts.py; then
              echo "PUBLISH GATE FAIL after rebase — aborting publish"
              exit 1
            fi
          done
          echo "push failed after 3 attempts"
          exit 1

      # Runs AFTER publication (audit 2026-09-27-a1 R7): a transport outage
      # is reported as a failed run, never by withholding a valid forecast.
      - name: Fail the run if alert delivery failed (after publication)
        if: steps.forecast.outputs.delivery_failed == 'true'
        run: |
          echo "::error::alert delivery failed on every requested channel (see data/alert_delivery_health.json); forecast artifacts were published and the alert remains eligible for retry"
          exit 1
