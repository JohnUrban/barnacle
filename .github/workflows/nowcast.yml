name: Barnacle Nowcast

# LIVE radar nowcast (2026-07-17, HANDOFF designated session).
# Requests a run every 10 minutes: a stdlib-only trigger check (~15 s, no heavy
# deps) decides whether radar is worth paying for — active NWS flood
# alert or near-term convective wording. When triggered: install
# xarray/cfgrib (cached), pull the last hour of MRMS PrecipRate over
# the hillside catchment, run the v0.10.2 tank, and commit
# docs/nowcast.json plus the rolling scheduler-arm heartbeat ledger.
# GitHub schedules are best-effort; the site
# and widget enforce a strict safety rule and never render >20-min-old
# radar output as live.
on:
  schedule:
    # Offset from round minutes to reduce GitHub schedule congestion.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # alert-ingest dispatch of the forecast workflow

concurrency:
  group: barnacle-nowcast
  # A full radar pass can outlive the 10-minute schedule interval.
  # Cancelling in-progress runs starved publication: completed commits
  # had a 31.6-minute median interval (60-minute p90) on 2026-07-18–21.
  # Keep the active run; GitHub may coalesce queued runs naturally.
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: America/New_York
      BARNACLE_SCHEDULER_ARM: github-actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          # cache:pip REQUIRES a requirements file to hash — without
          # one, setup-python FAILS the whole job (found 2026-07-18
          # after a night of 10-minute failure-notification emails).
          cache: 'pip'
          cache-dependency-path: forecast/nowcast-requirements.txt

      - name: Trigger check (stdlib, cheap)
        id: gate
        run: |
          set +e
          python forecast/nowcast.py --check
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "3" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            if [ "$(date -u +'%M')" = "03" ]; then
              python forecast/nowcast.py --record-gated-quiet
              echo "heartbeat=true" >> "$GITHUB_OUTPUT"
            else
              echo "heartbeat=false" >> "$GITHUB_OUTPUT"
            fi
          else
            exit $code
          fi

      - name: Install radar deps
        if: steps.gate.outputs.go == 'true'
        run: pip install --quiet -r forecast/nowcast-requirements.txt

      - name: Run nowcast
        if: steps.gate.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python forecast/nowcast.py

      - name: Publish gate (no markers, strict JSON)
        if: steps.gate.outputs.go == 'true'
        run: python forecast/check_artifacts.py

      # RADAR-FED ALERTING (event #7, 2026-08-07: +16.9 in projected,
      # no NWS product, no alert). Fresh alertable street water that
      # alert_state hasn't covered dispatches the forecast workflow;
      # the transactional pipeline + daily cap decide the actual send.
      - name: Commit nowcast.json
        if: steps.gate.outputs.go == 'true' || steps.gate.outputs.heartbeat == 'true'
        run: |
          git config user.name "barnacle-nowcast"
          git config user.email "actions@users.noreply.github.com"
          git add data/nowcast_heartbeats.csv
          if [ "${{ steps.gate.outputs.go }}" = "true" ]; then
            git add docs/nowcast.json
            message="nowcast $(date -u +'%Y-%m-%d %H:%M') UTC"
          else
            message="nowcast gated-quiet heartbeat $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          fi
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "$message"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict - abort publish"; exit 1; }
            python forecast/check_artifacts.py
            sleep 2
          done
          exit 1

      # DISPATCHES RUN AFTER THE PUSH (event #8, 2026-09-01: the
      # 23:15Z run projected +14.3 and dispatched, but the forecast
      # run checked out main seconds BEFORE the nowcast commit
      # landed — it read the pre-burst file and never saw the radar
      # signal. Alert evaluation depends on committed state, so
      # dispatch must follow the push, not the local write.
      # ALERT-INGEST FAST PATH (2026-08-03: FFW cut ~10:36, ingested
      # 11:00 — official-alert latency was ~30 min after street peak).
      # If an active NWS alert isn't in alert_state yet, dispatch the
      # forecast workflow NOW (force_email=false: normal transactional
      # evaluation decides delivery; no daily archive side effects).
      - name: Alert-ingest dispatch check (stdlib, cheap)
        id: adc
        run: |
          set +e
          python forecast/nowcast.py --alert-dispatch-check
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Radar alert dispatch check
        if: steps.gate.outputs.go == 'true'
        id: rac
        run: |
          set +e
          python forecast/nowcast.py --radar-alert-check
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
          fi

      # Exactly one dispatch for either official-alert ingestion or a
      # newly eligible radar impact. Any API failure makes the run red.
      - name: Dispatch forecast workflow for immediate alert evaluation
        id: dispatch
        if: steps.adc.outputs.dispatch == 'true' || steps.rac.outputs.dispatch == 'true'
        run: |
          for attempt in 1 2 3; do
            if curl -sf -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily_forecast.yml/dispatches" \
              -d '{"ref":"main","inputs":{"force_email":"false"}}'; then
              echo "dispatched on attempt $attempt"
              exit 0
            fi
            echo "::warning::forecast dispatch attempt $attempt failed"
            sleep $((attempt * 2))
          done
          echo "::error::forecast dispatch failed after 3 attempts"
          exit 1
